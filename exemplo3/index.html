<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praticando os estilos no Javascript</title>
    <script src="./script.js" defer></script>
</head>
<body>
    <h1 id="titulo">Titulo Principal</h1>
    <h2 id="subtitulo">Subtitulo da Página</h2>
    <p id="paragrafo">
        Este é um <b>paragrafo</b> com conteudo HTML interno
    </p>
    <br>

    <button onclick="mudarCor()">Mudar cor do titulo</button>
    <button onclick="mudarFundo()">Mudar fundo do paragrafo</button>
    <button onclick="esconder()">Esconder subtitulo</button>
</body>
</html>
